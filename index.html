<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Internet Machine</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            border: 2px solid white;
            padding: 40px;
            max-width: 600px;
        }

        h1 {
            font-size: 42px;
        }

        button {
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
            background: white;
            color: black;
            border: none;
        }

        button:hover {
            background: #ccc;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }

        #goofyMessage {
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🎲 RANDOM INTERNET MACHINE</h1>

        <p id="goofyMessage"></p>

        <p>
            You have absolutely no idea where this button will take you.
        </p>

        <button onclick="goRandom()">SEND ME SOMEWHERE RANDOM</button>

        <p id="status"></p>
    </div>

    <script>
        const websites = [
            "https://en.wikipedia.org/wiki/Special:Random",
            "https://neal.fun/",
            "https://www.nasa.gov/",
            "https://archive.org/",
            "https://www.google.com/doodles",
            "https://xkcd.com/",
            "https://www.coolmathgames.com/",
            "https://youtu.be/_ELyfelxkU8?si=sPZ2HE5IgVecqEy0",
            "https://www.github.com/",
            "https://www.nationalgeographic.com/",
            "https://www.metmuseum.org/art/collection",
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
        ];

        const goofyMessages = [
            "WHY ARE YOU HERE 💀",
            "The internet has been notified.",
            "🦅 GOOFY MODE ACTIVATED.",
            "NASA has been notified.",
            "Your computer is now slightly confused.",
            "Congratulations. You found the website.",
            "There are absolutely no ducks here.",
            "DO NOT TRUST THE POTATO.",
            "The council has decided you may proceed.",
            "🚨 GOOFY DETECTED 🚨",
            "Please remain calm. The internet is fine.",
            "You have been selected for absolutely nothing.",
            "ERROR: Seriousness not found.",
            "The braincell is working overtime.",
            "🗿",
            "Rick Astley is somewhere out there.",
            "SPACE.",
            "This website was approved by a very small goblin.",
            "Someone put a website here.",
            "I have no idea what I'm doing.",
            "WELCOME, INTERNET TRAVELER.",
            "The button yearns to be pressed.",
            "This is probably a terrible idea.",
            "You have entered the goofy zone."
        ];

        const randomMessage =
            goofyMessages[Math.floor(Math.random() * goofyMessages.length)];

        document.getElementById("goofyMessage").textContent = randomMessage;

        function goRandom() {
            const randomIndex = Math.floor(Math.random() * websites.length);
            const destination = websites[randomIndex];

            document.getElementById("status").textContent =
                "DESTINATION SELECTED. GOOD LUCK.";

            setTimeout(() => {
                window.location.href = destination;
            }, 700);
        }
    </script>

</body>
</html>
